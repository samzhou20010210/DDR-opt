# =====================================================================================
#  Pool rescue simulation — SINGLE SOURCE OF TRUTH for all pool / vessel / mode params.
# =====================================================================================
# Every leaf is {value, unit, source}.
#   unit   : SI unit, "-" for dimensionless / bool / string.
#   source : where the initial value comes from:
#              "stock: <file>"      value kept from the original DDR-opt example
#              "standard: <ref>"    public facility / engineering reference
#              "assumption: <why>"  engineering guess — CONFIRM against the real vessel
#
# Workflow:  edit this file  ->  python3 pool_rescue/scripts/gen_ddr_params.py
#            -> regenerates config/generated/<mode>/<node>.yaml (DDR-opt's flat keys)
#            -> python3 pool_rescue/scripts/check_params.py   (offline consistency check)
# At launch this file is also loaded under /pool for new (non-legacy) nodes.
#
# Frames: world = origin at the pool corner next to the standby position, x along the pool
# length, y along the width, z up (REP-103 right-handed). base_link = vessel centre,
# x forward, y left.
# =====================================================================================

frames:
  world:      {value: world,     unit: "-", source: "stock: DDR-opt uses 'world' everywhere"}
  base_link:  {value: base_link, unit: "-", source: "standard: REP-105 body frame name"}

pool:
  length:     {value: 25.0, unit: m, source: "standard: World Aquatics short-course (25 m) pool"}
  width:      {value: 12.5, unit: m, source: "assumption: 5 lanes x 2.5 m (World Aquatics lane width)"}
  wall_thickness_in_map: {value: 0.2, unit: m, source: "assumption: wall box centred on the edge -> 1 occupied 0.1 m cell inside the pool, same as stock boundary walls"}
  map_resolution: {value: 0.1, unit: m, source: "stock: planner_sim.launch gridmap_interval_"}
  lanes:            # lane ropes run the full pool length (x); visual only — NOT obstacles (the vessel passes over them)
    count:        {value: 5,    unit: "-", source: "assumption: 5 lanes fill the 12.5 m width exactly"}
    lane_width:   {value: 2.5,  unit: m,   source: "standard: World Aquatics lane width 2.5 m"}
    outer_space:  {value: 0.0,  unit: m,   source: "assumption: no extra space outside lanes 1 and 5 in this 12.5 m pool (World Aquatics competition pools add 0.2 m)"}
    rope_diameter: {value: 0.10, unit: m,  source: "standard: World Aquatics lane rope floats 0.05-0.15 m diameter"}

standby:            # start pose near the (0,0) corner
  x:   {value: 1.2, unit: m,   source: "assumption: vessel half-diagonal 0.58 m + wall clearance 0.3 m + 0.3 m slack"}
  y:   {value: 1.2, unit: m,   source: "assumption: same as x"}
  yaw: {value: 0.0, unit: rad, source: "assumption: facing along the pool length (+x)"}

vessel:
  length:   {value: 1.0, unit: m, source: "assumption: small twin-thruster rescue USV (commercial rescue USVs ~1.2 m), scaled for a pool"}
  width:    {value: 0.6, unit: m, source: "assumption: twin-hull beam able to carry a person's upper body"}
  height:   {value: 0.3, unit: m, source: "assumption: visualization only (simulator marker height)"}
  thruster_separation: {value: 0.5, unit: m, source: "assumption: beam minus 0.1 m; sets ICR_yl/yr = +-0.25 m for the standard diff-drive model"}
  couple_speed_and_turn_limits: {value: true, unit: "-", source: "stock: car3ms.yaml if_directly_constrain_v_omega=false (v and omega share the thrust budget, like wheel-speed limits)"}
  reverse_enabled: {value: true, unit: "-", source: "assumption: thrusters can run in reverse; false -> hull_sim clamps v >= 0 and the planner gets min_vel = 0"}

control:
  latency:  {value: 0.10, unit: s,  source: "assumption: ESC + serial/radio command path on small USVs (50-150 ms)"}
  mpc_dt:   {value: 0.01, unit: s,  source: "stock: mpc_controller/config/mpc3ms.yaml dt"}
  rate:     {value: 100.0, unit: Hz, source: "stock: mpc3ms.yaml cmd_timer_rate"}
  cmd_timeout: {value: 0.5, unit: s, source: "assumption: hull_sim targets zero velocity if no command arrives for this long (lost-link safety)"}
  replan_period: {value: 5000.0, unit: s, source: "stock: planner_sim.launch replan_time (5000 = no periodic replanning)"}
  max_replan_time: {value: 0.05, unit: s, source: "stock: planner_sim.launch max_replan_time"}

# Collision model (single definition, applied by scripts/gen_ddr_params.py — nothing else may add inflation):
#   collision radius  r = hypot(vessel.length/2, vessel.width/2)   (DERIVED, circle enclosing the hull; not configured)
#   safety margin     m = safety.margin
#   planning clearance  r + m : JPS cell blocking (jps_safe_dis) and optimizer penalty (safeDis, checkpoint at centre)
#   verification        r     : finalMinSafeDis — a trajectory whose centre comes closer than r to an obstacle is
#                                rejected (the hull circle would touch it); the margin is the soft buffer on top.
#   map inflation       none  : the planner's grid/ESDF hold true obstacle geometry; all clearance comes from above.
safety:
  margin:           {value: 0.30, unit: m, source: "stock: back_end global_planning3ms.yaml safeDis; applies to walls and obstacles"}
  person_clearance: {value: 0.50, unit: m, source: "assumption: keep 0.5 m from non-target swimmers' footprints (not yet consumed: persons are not in the planner map)"}

sensing:
  detection_range:  {value: 30.0, unit: m, source: "assumption: whole pool observable (diagonal 27.95 m), e.g. overhead camera"}
  perspective:      {value: true, unit: "-", source: "assumption: obstacles do not occlude (open water); stock planner_sim.launch default"}

simulation:
  add_noise:        {value: true, unit: "-", source: "stock: planner_sim.launch if_add_noise"}
  noise_stddev:     {value: 0.01, unit: "-", source: "stock: planner_sim.launch noise_stddev (relative to v, omega)"}
  hull_sim_rate:    {value: 100.0, unit: Hz, source: "assumption: matches the 100 Hz control rate; hull_sim integration and odom publish rate"}
  trajectory_period: {value: 0.1, unit: s, source: "assumption: RViz trajectory sample spacing (10 Hz)"}
  trajectory_max_points: {value: 6000, unit: "-", source: "assumption: 10 min of trajectory at 10 Hz"}

# Kinematic limits per operating mode. Speeds/accelerations are magnitudes (>0).
# DDR-opt has one symmetric acceleration limit: the generator uses min(acceleration, deceleration).
modes:
  approach:          # empty vessel, driving to the person
    max_forward_speed: {value: 1.0, unit: m/s,     source: "assumption: below lifeguard sprint swim speed (~1.5-2 m/s) to stay controllable near swimmers"}
    max_reverse_speed: {value: 0.3, unit: m/s,     source: "assumption: small-USV propellers give much less thrust in reverse"}
    max_acceleration:  {value: 0.5, unit: m/s^2,   source: "assumption: thrust-to-mass of a ~20 kg USV, drag-limited"}
    max_deceleration:  {value: 0.4, unit: m/s^2,   source: "assumption: braking relies on weaker reverse thrust + drag"}
    max_yaw_rate:      {value: 0.8, unit: rad/s,   source: "assumption: differential thrust at 0.5 m separation"}
    max_yaw_accel:     {value: 1.0, unit: rad/s^2, source: "assumption: yaw inertia of a 1 m hull"}
    max_centripetal_acc: {value: 0.5, unit: m/s^2, source: "assumption: limits sway/skid in turns (v*omega)"}
    standoff_distance: {value: 1.0, unit: m,       source: "assumption: stop 1 m from the target's footprint before the final approach"}
    final_approach_speed: {value: 0.3, unit: m/s,  source: "assumption: walking pace, safe contact speed with a person"}
  rescue:            # person on board
    max_forward_speed: {value: 0.5, unit: m/s,     source: "assumption: ~50% of approach for added mass (70-100 kg) and stability"}
    max_reverse_speed: {value: 0.2, unit: m/s,     source: "assumption: ~2/3 of approach reverse"}
    max_acceleration:  {value: 0.25, unit: m/s^2,  source: "assumption: ~50% of approach (added mass, comfort)"}
    max_deceleration:  {value: 0.25, unit: m/s^2,  source: "assumption: avoid throwing the person forward"}
    max_yaw_rate:      {value: 0.4, unit: rad/s,   source: "assumption: ~50% of approach (stability with person on board)"}
    max_yaw_accel:     {value: 0.5, unit: rad/s^2, source: "assumption: ~50% of approach"}
    max_centripetal_acc: {value: 0.2, unit: m/s^2, source: "assumption: comfort / capsize margin with raised centre of mass"}
    dock_position_tolerance: {value: 0.3, unit: m, source: "assumption: arrival tolerance inside the extraction zone"}
    dock_yaw_tolerance:      {value: 0.2, unit: rad, source: "assumption: ~11 deg alignment to the pool edge"}

extraction_zone:    # default hand-over zone, short wall next to the standby corner
  name:   {value: corner_edge, unit: "-", source: "assumption"}
  x:      {value: 1.0, unit: m,   source: "assumption: vessel centre 1.0 m from the x=0 wall"}
  y:      {value: 3.0, unit: m,   source: "assumption: next to (not on) the standby spot"}
  theta:  {value: 3.14159, unit: rad, source: "assumption: bow facing the x=0 wall for hand-over"}
  length: {value: 1.5, unit: m,   source: "assumption"}
  width:  {value: 2.0, unit: m,   source: "assumption"}
